name: Haftalık menü güncelle
on:
  schedule:
    - cron: "0 4 * * 1"   # her Pazartesi 07:00 (Türkiye saati)
  workflow_dispatch:       # elle de çalıştırılabilir
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_menu.py
      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git diff --staged --quiet || (git commit -m "Menü güncellendi" && git push)
